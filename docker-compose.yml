services:
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-teams-bridge:latest
    container_name: hermes-teams-bridge
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HERMES_HOME: ${HERMES_CONTAINER_HOME:?set HERMES_CONTAINER_HOME in .env}
      HERMES_WRITE_SAFE_ROOT: ${HERMES_CONTAINER_HOME:?set HERMES_CONTAINER_HOME in .env}
      TEAMS_BRIDGE_STATE_DIR: ${HERMES_CONTAINER_HOME:?set HERMES_CONTAINER_HOME in .env}/teams-bridge
      TEAMS_BRIDGE_DB_PATH: ${HERMES_CONTAINER_HOME:?set HERMES_CONTAINER_HOME in .env}/state.db
      TEAMS_BRIDGE_PROXY_PORT: ${TEAMS_BRIDGE_PROXY_PORT:-18790}
      HERMES_UID: ${HERMES_UID:-}
      HERMES_GID: ${HERMES_GID:-}
    volumes:
      - "${HERMES_HOST_HOME:?set HERMES_HOST_HOME in .env}:${HERMES_CONTAINER_HOME:?set HERMES_CONTAINER_HOME in .env}"
      - ./config.json:/app/config.json:ro
    network_mode: host
    security_opt:
      - no-new-privileges:true
